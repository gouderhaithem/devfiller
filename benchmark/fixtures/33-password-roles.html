<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Sécurité du compte</title></head>
<body>
<main>
  <h1>Changer le mot de passe</h1>
  <form action="/compte/mot-de-passe" method="post" data-form-type="other">
    <p><label for="old">Mot de passe actuel</label><input type="password" id="old" name="old_pw" data-expect="password"></p>
    <p><label for="new">Nouveau mot de passe</label><input type="password" id="new" name="new_pw" data-expect="password" data-differs-from="#old"></p>
    <p><label for="new2">Confirmer le nouveau mot de passe</label><input type="password" id="new2" name="new_pw2" data-expect="password" data-same-as="#new"></p>
    <button type="submit">Enregistrer</button>
  </form>
  <form action="/login" method="post" data-form-type="login">
    <p><label for="u">Identifiant</label><input id="u" name="login" data-expect="username"></p>
    <p><label for="pw">Mot de passe</label><input type="password" id="pw" name="pw" data-expect="password"></p>
    <p><label><input type="checkbox" name="remember" data-expect="skip:session"> Se souvenir de moi</label></p>
    <button type="submit">Connexion</button>
  </form>
  <form action="/recherche" method="get" role="search" data-form-type="search">
    <input type="search" name="q" aria-label="Rechercher" data-expect="search">
    <button type="submit">OK</button>
  </form>
</main>
</body>
</html>
