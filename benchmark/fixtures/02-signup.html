<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account</title>
<style>
  body { font-family: Helvetica, Arial, sans-serif; background: #eef1f5; margin: 0; }
  main { max-width: 520px; margin: 24px auto; background: #fff; padding: 28px; border-radius: 6px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .mb-3 { margin-bottom: 16px; }
  .form-label { display: block; font-weight: 600; margin-bottom: 4px; }
  .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
  fieldset { border: 0; padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Join Acme</h1>
  <form class="needs-validation" action="/register" method="post">
    <div class="row mb-3">
      <div>
        <label class="form-label" for="first_name">First name</label>
        <input type="text" class="form-control" id="first_name" name="first_name" autocomplete="given-name" required maxlength="40" data-expect="firstName">
      </div>
      <div>
        <label class="form-label" for="last_name">Last name</label>
        <input type="text" class="form-control" id="last_name" name="last_name" autocomplete="family-name" required maxlength="40" data-expect="lastName">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" autocomplete="email" required data-expect="email">
    </div>
    <div class="mb-3">
      <label class="form-label" for="email2">Confirm email</label>
      <input type="email" class="form-control" id="email2" name="email_confirmation" autocomplete="email" required data-expect="email">
    </div>
    <div class="mb-3">
      <label class="form-label" for="pw">Password</label>
      <input type="password" class="form-control" id="pw" name="password" autocomplete="new-password" minlength="8" required data-expect="password">
    </div>
    <div class="mb-3">
      <label class="form-label" for="pw2">Confirm password</label>
      <input type="password" class="form-control" id="pw2" name="password_confirmation" autocomplete="new-password" minlength="8" required data-expect="password">
    </div>
    <div class="mb-3">
      <label class="form-label" for="dob">Date of birth</label>
      <input type="date" class="form-control" id="dob" name="dob" autocomplete="bday" max="2010-12-31" required data-expect="birthDate">
    </div>
    <fieldset class="mb-3">
      <legend class="form-label">Gender</legend>
      <label><input type="radio" name="gender" value="m" data-expect="gender"> Male</label>
      <label><input type="radio" name="gender" value="f" data-expect="gender"> Female</label>
      <label><input type="radio" name="gender" value="x" data-expect="gender"> Prefer not to say</label>
    </fieldset>
    <div class="mb-3">
      <label><input type="checkbox" name="terms" required data-expect="skip:consent"> I accept the Terms of Service and Privacy Policy</label>
    </div>
    <div class="mb-3">
      <label><input type="checkbox" name="newsletter" data-expect="skip:consent"> Send me the weekly newsletter</label>
    </div>
    <button type="submit" class="btn btn-primary">Create account</button>
  </form>
</main>
</body>
</html>
