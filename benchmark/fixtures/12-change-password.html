<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security settings - Change password</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7f9; }
  header { background: #fff; padding: 10px 20px; border-bottom: 1px solid #e0e0e0; }
  main { max-width: 480px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 6px; }
  .mb-3 { margin-bottom: 14px; }
  .form-label { display: block; margin-bottom: 4px; }
  .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
  .form-text { font-size: 12px; color: #777; }
</style>
</head>
<body>
<header>
  <input type="search" name="q" placeholder="Search settings" aria-label="Search settings" data-expect="search">
</header>
<main>
  <h1>Change password</h1>
  <form action="/settings/security/password" method="post" data-form-type="other">
    <div class="mb-3">
      <label class="form-label" for="acct-user">Username</label>
      <input type="text" class="form-control" id="acct-user" name="username" value="jdoe" readonly autocomplete="username" data-expect="username">
    </div>
    <div class="mb-3">
      <label class="form-label" for="pw-current">Current password</label>
      <input type="password" class="form-control" id="pw-current" name="current_password" autocomplete="current-password" required data-expect="password">
    </div>
    <div class="mb-3">
      <label class="form-label" for="pw-new">New password</label>
      <input type="password" class="form-control" id="pw-new" name="new_password" autocomplete="new-password" minlength="10" required aria-describedby="pw-help" data-expect="password" data-differs-from="#pw-current">
      <div id="pw-help" class="form-text">At least 10 characters.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="pw-confirm">Confirm new password</label>
      <input type="password" class="form-control" id="pw-confirm" name="new_password_confirmation" autocomplete="new-password" required data-expect="password" data-same-as="#pw-new">
    </div>
    <div class="mb-3">
      <label class="form-label" for="pw-2fa">Two-factor verification code</label>
      <input type="text" class="form-control" id="pw-2fa" name="totp" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code" required data-expect="skip:otp">
    </div>
    <div class="mb-3">
      <label class="form-label" for="rec-mail">Recovery email</label>
      <input type="email" class="form-control" id="rec-mail" name="recovery_email" data-expect="email">
    </div>
    <div class="mb-3">
      <label class="form-label" for="rec-tel">Recovery phone</label>
      <input type="tel" class="form-control" id="rec-tel" name="recovery_phone" data-expect="phone">
    </div>
    <div class="mb-3">
      <label><input type="checkbox" name="signout_all" checked data-expect="unknown"> Sign me out of all other devices</label>
    </div>
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</main>
</body>
</html>
