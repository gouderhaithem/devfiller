<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us - Brightside Studio</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.5; }
  header { background: #222; color: #fff; padding: 10px 24px; display: flex; justify-content: space-between; }
  main { max-width: 600px; margin: 24px auto; padding: 0 16px; }
  .form-group { margin-bottom: 14px; }
  .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
  footer { background: #f0f0f0; padding: 16px 24px; }
</style>
</head>
<body>
<header>
  <strong>Brightside</strong>
  <input type="search" name="s" aria-label="Search" placeholder="Search..." data-expect="search">
</header>
<main>
  <h1>Get in touch</h1>
  <form action="/contact" method="post" novalidate data-form-type="contact">
    <div class="form-group">
      <label for="cf-name">Your name</label>
      <input type="text" class="form-control" id="cf-name" name="your-name" autocomplete="name" required data-expect="fullName">
    </div>
    <div class="form-group">
      <label for="cf-email">Your email</label>
      <input type="email" class="form-control" id="cf-email" name="your-email" required data-expect="email">
    </div>
    <div class="form-group">
      <label for="cf-phone">Phone number (optional)</label>
      <input type="tel" class="form-control" id="cf-phone" name="your-phone" data-expect="phone">
    </div>
    <div class="form-group">
      <label for="cf-subject">Subject</label>
      <input type="text" class="form-control" id="cf-subject" name="your-subject" maxlength="120" data-expect="subject">
    </div>
    <div class="form-group">
      <label for="cf-message">Message</label>
      <textarea class="form-control" id="cf-message" name="your-message" rows="6" required data-expect="message"></textarea>
    </div>
    <fieldset class="form-group">
      <legend>How should we reply?</legend>
      <label><input type="radio" name="reply_via" value="email" checked data-expect="unknown"> By email</label>
      <label><input type="radio" name="reply_via" value="phone" data-expect="unknown"> By phone</label>
      <label><input type="radio" name="reply_via" value="any" data-expect="unknown"> Either is fine</label>
    </fieldset>
    <div class="form-group">
      <label><input type="checkbox" name="privacy" required data-expect="skip:consent"> I consent to having this website store my submitted information so they can respond to my inquiry.</label>
    </div>
    <button type="submit" class="btn">Send message</button>
  </form>
<footer>
  <form action="/subscribe" method="post" data-form-type="other">
    <label>Newsletter
      <input type="email" name="mc_email" placeholder="Your email address" data-expect="email">
    </label>
    <label><input type="checkbox" name="mc_optin" data-expect="skip:consent"> Yes, I would like to receive marketing emails</label>
    <button type="submit">Join</button>
  </form>
</footer>
</main>
</body>
</html>
