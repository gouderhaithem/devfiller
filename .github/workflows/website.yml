name: Website

# Vercel deploys the site; this job only checks that it lints and builds.
on:
  pull_request:
    paths:
      - website/**
      - PRIVACY.md
      - FIELD_GUIDE.md
      - src/data.ts
      - src/samples.ts
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
